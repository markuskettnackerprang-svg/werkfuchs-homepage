<!doctype html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>E-Mail bestätigt – WerkFuchs Pro</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7fb;

    }
    main {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    section {
      max-width: 560px;
      background: white;
      border-radius: 20px;
      padding: 28px;
      text-align: center;
      box-shadow: 0 8px 24px rgba(30, 47, 85, 0.08);
    }
    h1 {
      color: #1e2f55;
      margin-top: 0;
      font-size: 2.2rem;
    }
    p {
      line-height: 1.6;
      color: #5f6b7c;
    }
    a {
      display: block;
      margin-top: 14px;
      padding: 14px 16px;
      border-radius: 14px;
      text-decoration: none;
      font-weight: bold;
    }
    .primary {
      background: #f58a1f;
      color: white;
    }
    .secondary {
      background: #e5e7eb;
      color: #1e2f55;
    }
  </style>
</head>
<body>
  <main>
    <section>
      <img
        src="assets/branding/WerkFuchs_Logo_Kreis.svg"
        alt="WerkFuchs Pro"
        style="width: 180px; max-width: 100%; height: auto; margin-bottom: 12px;"
      />
      <h1>E-Mail bestätigt</h1>
      <p>Deine E-Mail-Adresse wurde erfolgreich bestätigt.</p>
      <p>Du kannst WerkFuchs Pro jetzt wieder öffnen und dich anmelden.</p>
      <a class="primary" href="werkfuchs://">App öffnen</a>
      <a class="secondary" href="https://www.werkfuchs.info">Zur WerkFuchs-Seite</a>
      <p>Falls sich die App nicht öffnet, öffne WerkFuchs Pro einfach manuell auf deinem Handy.</p>
    </section>
  </main>
</body>
</html>
